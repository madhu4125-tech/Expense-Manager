name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Allow reading SMS (for Import from SMS)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.READ_SMS" "$MANIFEST"; then
            sed -i '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.READ_SMS" />' "$MANIFEST"
          fi
          grep -n "uses-permission" "$MANIFEST"

      - name: Generate app icon and splash screen
        run: npx capacitor-assets generate --android

      - name: Sync web assets and plugins
        run: npx cap sync android

      - name: Patch SMS plugin to Java 17 (plugin asks for Java 21)
        run: |
          F=node_modules/capacitor-sms-inbox/android/build.gradle
          grep -n "21" "$F" || true
          sed -i 's/VERSION_21/VERSION_17/g; s/JavaLanguageVersion.of(21)/JavaLanguageVersion.of(17)/g' "$F"
          echo "--- after patch ---"
          grep -n "VERSION_\|JavaLanguageVersion" "$F" || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: expense-manager-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
